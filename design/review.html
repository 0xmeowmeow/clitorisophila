function render(){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===active)));$('#rationale').textContent=selected().rationale;$('#against').hidden=!$('#compare').checked;$('#frames').replaceChildren(frame(selected()));if($('#compare').checked)$('#frames').append(frame(data.candidates.find(c=>c.id===$('#against').value)))}
function decision(){const c=selected(),none=$('#verdict').value==='none';return {project:data.project,manifest_sha256:data.manifest_sha256,candidate_id:none?null:c.id,source_sha256:none?null:c.sha256,verdict:$('#verdict').value,scope:$('#scope').value,comments:$('#comments').value,chosen_at:new Date().toISOString()}}
function download(){const url=URL.createObjectURL(new Blob([JSON.stringify(decision(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='design-choice.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#compare').onchange=render;$('#against').onchange=render;$('#viewport').onchange=render;$('#download').onclick=download;
$('#save').onclick=async()=>{if(location.protocol==='file:'){download();$('#status').textContent='Downloaded your decision. Give that file to Codex; nothing was written to the project automatically.';return}try{if(!token)throw Error('Local session unavailable. Download the decision instead.');const r=await fetch('/choice',{method:'POST',headers:{'Content-Type':'application/json','X-Audition-Token':token},body:JSON.stringify(decision())});const v=await r.json();if(!r.ok)throw Error(v.error);$('#status').textContent='Saved '+v.saved+'. Codex can read this receipt. No redesign or global setting was applied.'}catch(e){$('#status').textContent=e.message}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(decision(),null,2));$('#status').textContent='Decision copied.'}catch{$('#status').textContent='Clipboard unavailable here. Use Download decision.'}};
if(location.protocol!=='file:')fetch('/session').then(r=>r.json()).then(v=>token=v.token).catch(()=>$('#status').textContent='Offline recording only: use Download decision.');render();
</script></body></html>
